    async function deriveKey(secret, salt) {
      const encoder = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        encoder.encode(secret),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: encoder.encode(salt), iterations: 250000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        true,
        ['encrypt', 'decrypt']
      );
    }

    function bufToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToBuf(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function encryptState(plaintext) {
      const key = await deriveKey(STATE_SECRET, STATE_SALT);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(plaintext);
      const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
      return `${bufToBase64(iv)}.${bufToBase64(cipher)}`;
    }

    async function decryptState(payload) {
      const [ivBase64, cipherBase64] = payload.split('.');
      if (!ivBase64 || !cipherBase64) {
        throw new Error('Invalid encrypted payload');
      }
      const key = await deriveKey(STATE_SECRET, STATE_SALT);
      const iv = base64ToBuf(ivBase64);
      const cipher = base64ToBuf(cipherBase64);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      return new TextDecoder().decode(plain);
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function jsArg(value) {
      return escapeHtml(JSON.stringify(value));

    function sameId(a, b) {
      return String(a) === String(b);

      localStorage.setItem(VOTE_STORAGE_KEY, JSON.stringify(votes));
    }

    function isMissingColumnError(error) {
      return error?.code === '42703' || /column .* does not exist/i.test(error?.message || '');
    }

    function getReportCategory(value) {
      return REPORT_CATEGORIES.find(category => category.value === value) || REPORT_CATEGORIES[REPORT_CATEGORIES.length - 1];
    }

    function getCooldownRemaining(key, duration) {
      const last = Number(localStorage.getItem(key) || 0);
      return Math.max(0, duration - (Date.now() - last));
    }

    function setCooldown(key) {
      localStorage.setItem(key, String(Date.now()));
    }

    function formatCooldown(ms) {
      return `${Math.ceil(ms / 1000)}s`;
    }

    async function sha256(text) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
    }

    async function currentUserIsAdmin() {
      if (!useSupabase) return false;
      const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
      if (userError || !user) return false;

      const { data, error } = await supabaseClient
        .from('admin_users')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

      return !error && !!data;
    }

    async function refreshAdminState() {
      state.isAdmin = await currentUserIsAdmin();
      const adminBtn = document.getElementById('adminBtn');
      if (adminBtn) {
        adminBtn.textContent = state.isAdmin ? 'Admin ✓' : 'Admin';
      }
      return state.isAdmin;
    }

    const state = {
      selectedNest: null,
      selectedPost: null,
      isAdmin: false,
      nests: [],
      posts: [],
      comments: [],
      reports: [],
      nextPostId: 1,
      nextCommentId: 1,
      reportFilter: 'new'
    };

    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal-content');

    overlay.addEventListener('click', closeModal);
    modal.addEventListener('click', event => event.stopPropagation());

    async function load() {
      if (useSupabase) {
        await refreshAdminState();
        await fetchRemoteState();
        // ensure default nests exist remotely
        if (!state.nests || state.nests.length === 0) {
          // create default nests remotely (ignore errors if they already exist)
          for (const n of INITIAL_NESTS) {
            try { await createNestRemote(n); } catch (e) { /* ignore */ }
          }
          await fetchRemoteState();
        }
        render();
        showTermsIfNeeded();
        return;
      }

      try {
        const response = await storageApi.get(STORAGE_KEY);
        const rawValue = typeof response === 'string' ? response : response?.value;
        if (rawValue) {
          let raw = rawValue;
          try {
            raw = await decryptState(rawValue);
          } catch {
            // If the stored state is not encrypted yet, fall back to plain JSON.
          }
          const saved = JSON.parse(raw);
          Object.assign(state, {
            ...state,
            ...saved,
            isAdmin: false,
            selectedPost: null
          });
        }
      } catch (error) {
        console.warn('Unable to load saved state', error);
      }

      if (state.nests.length === 0) {
        state.nests = [...INITIAL_NESTS];
        state.posts = [];
        state.nextPostId = 1;
        await save();
      } else if (!state.nests.some(nest => nest.id === 'nest_5')) {
        state.nests.push(INITIAL_NESTS[4]);
        await save();
      }

      render();
      showTermsIfNeeded();
    }

    async function save() {
      // When using Supabase we persist per-table on each action; local save kept for fallback only.
      if (useSupabase) return;
      try {
        const payload = JSON.stringify({
          nests: state.nests,
          posts: state.posts,
          comments: state.comments,
          reports: state.reports,
          nextPostId: state.nextPostId,
          nextCommentId: state.nextCommentId
        });
        const encrypted = await encryptState(payload);
        await storageApi.set(STORAGE_KEY, encrypted);
      } catch (error) {
        console.warn('Unable to save state', error);
      }
    }

    function visiblePosts() {
      return state.posts.filter(post => !post.hidden && post.status !== 'hidden');
    }

    function postAuthorLabel(post) {
      return post.authorRole === 'admin' ? 'admin' : 'anonymous';
    }

    function getNestColor(nest) {
      return NEST_COLORS[nest.color % NEST_COLORS.length];
    }

    const BAD_WORDS = [
      'fuck',
      'shit',
      'bitch',
      'asshole',
      'bastard',
      'hell',
      'idiot',
      'stupid',
      'nigger',
      'dick',
      'porn',
      'suicide',
      'kill yourself',
      'kys',
      'test answers',
      'exam answers',
      'cheat',
      'plagiarize'
    ];

    function censorWord(match) {
      return '*'.repeat(match.length);
    }

    function sanitizeText(text) {
      if (!text) return '';
      const escapedWords = BAD_WORDS.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const pattern = new RegExp(`\\b(${escapedWords.join('|')})\\b`, 'gi');
      return text.replace(pattern, censorWord);
    }

    function timeAgo(timestamp) {
      const seconds = (Date.now() - timestamp) / 1000;
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }

    function countWords(s) {
      if (!s) return 0;
      const trimmed = String(s).trim();
      if (trimmed === '') return 0;
      return trimmed.split(/\s+/).length;
    }

    function updatePostWordCount() {
      const title = document.getElementById('pTitle');
      const body = document.getElementById('pBody');
      const el = document.getElementById('wordCount');
      if (!el) return;
      const words = (title ? countWords(title.value) : 0) + (body ? countWords(body.value) : 0);
      el.textContent = `${words} / 100 words`;
      el.style.color = words > 100 ? '#c0392b' : 'var(--text2)';
    }

    function updateCommentCount() {
      const input = document.getElementById('commentText');
      const el = document.getElementById('commentCount');
      if (!input || !el) return;
      el.textContent = `${input.value.length} / ${COMMENT_MAX_CHARS}`;
      el.style.color = input.value.length > COMMENT_MAX_CHARS ? '#c0392b' : 'var(--text2)';
    }

    async function confirmReport(postId) {
      const category = document.getElementById('reportCategory')?.value || 'other';
      const reason = document.getElementById('reportReason')?.value.trim() || '';
      const report = { id: `r_${Date.now()}`, postId, category, reason, time: Date.now(), status: 'new' };
      if (useSupabase) {
        try {
          await createReportRemote(report);
          closeOverlay();
          alert(category === 'safety' ? 'Report submitted. If there is immediate danger, contact a trusted adult or emergency services now.' : 'Report submitted. Thank you.');
          return;
        } catch (err) {
          console.warn('Remote report failed', err);
          alert('Unable to submit report. Falling back to local save.');

      }

      state.reports.push(report);

    async function resolveReport(reportId) {
      const r = state.reports.find(x => x.id === reportId);

      r.status = 'resolved';
      if (useSupabase) {
        try {
          await updateReportRemote(reportId, { status: 'resolved' });
          showAdminReports();

          await deleteReportRemote(reportId);
          showAdminReports();

        } catch (err) {

    async function deletePostAdmin(postId) {
      if (!confirm('Delete this post and all associated reports/comments?')) return;
      if (useSupabase) {
        try {
          // Remove related rows first in case the database does not have cascade deletes.
          await supabaseClient.from('comments').delete().eq('post_id', postId);
          await supabaseClient.from('reports').delete().eq('post_id', String(postId));
          await deletePostRemote(postId);
          await fetchRemoteState();
          showAdminReports();
          render();
          return;
        } catch (err) {
          console.warn('Remote delete post failed', err);
          alert('Unable to delete post remotely. Falling back to local deletion.');
        }
      }

      state.posts = state.posts.filter(p => !sameId(p.id, postId));
      state.comments = state.comments.filter(c => !sameId(c.postId, postId));
      state.reports = state.reports.filter(r => !sameId(r.postId, postId));
      await save();
      showAdminReports();
      render();
    }

    async function hidePostAdmin(postId) {
      if (!confirm('Hide this post from the public feed? Reports and comments will be kept for review.')) return;
      if (useSupabase) {
        try {
          await hidePostRemote(postId);
          state.selectedPost = sameId(state.selectedPost, postId) ? null : state.selectedPost;
          showAdminReports();
          render();
          return;
        } catch (err) {
          console.warn('Remote hide failed', err);
          if (!confirm('Your database may not have hidden/status columns yet. Delete the post instead?')) return;
          await deletePostAdmin(postId);
          return;
        }
      }

      const post = state.posts.find(p => sameId(p.id, postId));
      if (post) {
        post.hidden = true;
        post.status = 'hidden';
      }
      state.selectedPost = sameId(state.selectedPost, postId) ? null : state.selectedPost;
      await save();
      showAdminReports();
      render();
    }

    function vote(postId, direction) {
      const post = state.posts.find(item => sameId(item.id, postId));
      if (!post) return;

      post.voters = post.voters || {};
      const current = post.voters.me || 0;
      const nextVote = current === direction ? 0 : direction;
      const delta = nextVote - current;

      if (useSupabase) {
        post.votes += delta;
        post.voters.me = nextVote;
        setSavedVote(postId, nextVote);
        render();
        voteRemote(postId, delta).then(() => render()).catch(err => {
          console.warn(err);
          post.votes -= delta;
          post.voters.me = current;
          setSavedVote(postId, current);
          render();
        });
        return;
      }

      post.votes += delta;
      post.voters.me = nextVote;

      save();
      render();
    }

    async function submitComment(postId) {
      const input = document.getElementById('commentText');
      const text = sanitizeText(input.value.trim());
      if (!text) return;
      if (text.length > COMMENT_MAX_CHARS) {
        alert(`Comments are limited to ${COMMENT_MAX_CHARS} characters.`);
        return;
      }

      const remaining = getCooldownRemaining(COMMENT_COOLDOWN_KEY, COMMENT_COOLDOWN_MS);
      if (remaining > 0) {
        alert(`Please wait ${formatCooldown(remaining)} before commenting again.`);
        return;
      }

      if (useSupabase) {
        try {
          await createCommentRemote({ postId, text });
          setCooldown(COMMENT_COOLDOWN_KEY);
          input.value = '';
          renderPostDetail();
        } catch (err) {
          console.warn('Comment save failed', err);
        }
        return;
      }

      state.comments.push({
        id: state.nextCommentId++,
        postId,
        text,
        time: Date.now()
      });

      input.value = '';
      setCooldown(COMMENT_COOLDOWN_KEY);
      await save();
      renderPostDetail();
    }

    function hasAcceptedTerms() {
      return localStorage.getItem(TERMS_STORAGE_KEY) === TERMS_VERSION || localStorage.getItem(LEGACY_TERMS_STORAGE_KEY) === 'yes';
    }

    function showTermsIfNeeded() {
      if (hasAcceptedTerms()) return;

      showOverlay(`
        <h2>Terms & Conditions</h2>
        <p style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:12px;">
          You must accept these terms before using The Hollow.
        </p>
        <div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2);font-size:13px;color:var(--text);line-height:1.6;">
          <p style="margin-bottom:10px;"><strong>1. About The Hollow</strong><br>The Hollow is an anonymous forum for students at our school to share thoughts, ask questions, and connect with peers. No account or login is required. Anonymity is a privilege - it comes with responsibility.</p>
          <p style="margin-bottom:10px;"><strong>2. Who This Forum Is For</strong><br>This forum is intended for students of our school only. By using it, you confirm that you are a current student.</p>
          <p style="margin-bottom:10px;"><strong>3. Academic Integrity</strong><br>The forum must not be used to share exam answers, test papers, or facilitate cheating, or to coordinate plagiarism or academic dishonesty in any form.</p>
          <p style="margin-bottom:10px;"><strong>4. Appropriate Content Only</strong><br>Do not post explicit, sexual, or adult content; graphic or violent material; spam or repetitive posts; advertisements; or self-promotion of paid services.</p>
          <p style="margin-bottom:10px;"><strong>5. Anonymity Has Limits</strong><br>While The Hollow does not collect personal information, posts that involve serious threats, harm, or illegal activity may be reported to school administration or authorities. Anonymity does not protect users from real-world consequences for harmful behavior.</p>
          <p style="margin-bottom:10px;"><strong>6. Content Removal</strong><br>Posts that violate these terms may be removed at any time without notice by moderators. Repeated or severe violations may result in your device or network being blocked from accessing the forum.</p>
          <p style="margin-bottom:10px;"><strong>7. No Guarantees</strong><br>The Hollow is provided as-is. We do not guarantee the forum will always be available, and we are not responsible for the views or content posted by users.</p>
          <p style="margin-bottom:10px;"><strong>8. Changes to These Terms</strong><br>These terms may be updated at any time. Continued use of the forum means you accept the current terms.</p>
          <p style="margin-bottom:10px;"><strong>9. Reporting</strong><br>If you see something that violates these terms, please use the report button. Do not engage with harmful posts - report them and move on.</p>
          <p><strong>10. Privacy</strong><br>The Hollow stores submitted posts, comments, reports, timestamps, report categories, and moderation status. Your browser may also store terms acceptance, voting choices, and anti-spam cooldown times.</p>
        </div>
        <div class="modal-footer" style="margin-top:14px;">
          <button class="btn-submit" onclick="acceptTerms()">I Agree</button>
        </div>
      `, true);
    }

    function acceptTerms() {
      localStorage.setItem(TERMS_STORAGE_KEY, TERMS_VERSION);
      localStorage.setItem(LEGACY_TERMS_STORAGE_KEY, 'yes');
      closeOverlay(true);
    }

    function showOverlay(html, locked = false) {
      modal.innerHTML = html;
      overlay.dataset.locked = locked ? 'true' : 'false';
      overlay.classList.add('visible');
    }

    function closeOverlay(force = false) {
      if (overlay.dataset.locked === 'true' && !force) return;
      overlay.classList.remove('visible');
      overlay.dataset.locked = 'false';
    }

    function closeModal(event) {
      if (event.target === overlay) {
        closeOverlay();
      }
    }

    function showAdminUnlock() {
      if (state.isAdmin) {
        logout();
        return;
      }

      if (useSupabase) {
        showOverlay(`
          <h2>Admin Login</h2>
          <p style="font-size:14px;color:var(--text2);margin-bottom:1rem;">Sign in with the admin account you added in Supabase Auth.</p>
          <label>Email</label>
          <input id="adminEmail" type="email" placeholder="you@example.com" autocomplete="username">
          <label>Password</label>
          <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if (event.key === 'Enter') checkAdminLogin()">
          <div id="pinErr" style="font-size:13px;color:#c0392b;margin:6px 0;"></div>
          <div class="modal-footer">
            <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
            <button class="btn-submit" onclick="checkAdminLogin()">Sign In</button>
          </div>
        `);
        return;
      }

      showOverlay(`
        <h2>Admin Login</h2>
        <p style="font-size:14px;color:var(--text2);margin-bottom:1rem;">Enter your admin PIN to manage The Hollow.</p>
        <label>PIN</label>
        <div class="pin-row">
          <input type="password" id="pinInput" maxlength="6" placeholder="••••••" onkeydown="if (event.key === 'Enter') checkPin()">
        </div>
        <div id="pinErr" style="font-size:13px;color:#c0392b;margin:6px 0;"></div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
          <button class="btn-submit" onclick="checkPin()">Unlock</button>
        </div>
      `);
    }

    async function checkAdminLogin() {
      const email = document.getElementById('adminEmail')?.value.trim();
      const password = document.getElementById('adminPassword')?.value || '';
      const errorEl = document.getElementById('pinErr');

      if (!email || !password) {
        if (errorEl) errorEl.textContent = 'Enter your email and password.';
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        if (errorEl) errorEl.textContent = 'Login failed. Check your email and password.';
        return;
      }

      const isAdmin = await refreshAdminState();
      if (!isAdmin) {
        await supabaseClient.auth.signOut();
        if (errorEl) errorEl.textContent = 'This account is not listed as an admin.';
        return;
      }

      await fetchRemoteState();
      closeOverlay();
      render();
    }

    async function checkPin() {
      const value = document.getElementById('pinInput').value;
      const hashed = await sha256(value);
      if (hashed === ADMIN_HASH) {
        state.isAdmin = true;
        document.getElementById('adminBtn').textContent = 'Admin ✓';
        closeOverlay();
        render();
        return;
      }

      document.getElementById('pinErr').textContent = 'Wrong PIN. Try again.';
      document.getElementById('pinInput').value = '';
    }

    function showCreatePost() {
      const options = state.nests.map(nest => `
        <option value="${escapeHtml(nest.id)}"${sameId(nest.id, state.selectedNest) ? ' selected' : ''}>
          ${nest.emoji} ${escapeHtml(nest.name)}
        </option>
      `).join('');
      showOverlay(`
        <h2>New Post</h2>
        <label>Nest</label>
        <select id="pNest">${options}</select>
        <label>Title</label>
        <input id="pTitle" placeholder="Post title..." oninput="updatePostWordCount()">
        <label>Body (optional)</label>
        <textarea id="pBody" placeholder="More details..." oninput="updatePostWordCount()"></textarea>
        <p id="wordCount" style="font-size:12px;color:var(--text2);margin:6px 0 4px;">0 / 100 words</p>
        <p style="font-size:12px;color:var(--text2);margin:0 0 8px;">Posts are always anonymous.</p>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
          <button class="btn-submit" onclick="submitPost()">Post</button>
        </div>
      `);
      updatePostWordCount();
    }

    async function submitPost() {
      const nestId = document.getElementById('pNest').value;
      const rawTitle = document.getElementById('pTitle').value.trim();
      const rawBody = document.getElementById('pBody').value.trim();
      const title = sanitizeText(rawTitle);
      const body = sanitizeText(rawBody);
      const remaining = getCooldownRemaining(POST_COOLDOWN_KEY, POST_COOLDOWN_MS);
      if (remaining > 0) {
        alert(`Please wait ${formatCooldown(remaining)} before posting again.`);
        return;
      }

      const totalWords = countWords(rawTitle) + countWords(rawBody);
      if (totalWords > 100) {
        alert(`Post exceeds 100 word limit (${totalWords}). Please shorten your post.`);
        return;
      }

      if (!title || !nestId) {
        alert('Please add a title and choose a nest.');
        return;
      }

      if (useSupabase) {
        try {
          await createPostRemote({ nestId, title, body, authorRole: state.isAdmin ? 'admin' : 'anonymous' });
          setCooldown(POST_COOLDOWN_KEY);
          closeOverlay();
          render();
        } catch (err) {
          console.warn('Remote post failed', err);
          alert('Unable to create post.');
        }
        return;
      }

      state.posts.push({
        id: state.nextPostId++,
        nestId,
        title,
        body,
        votes: 0,
        voters: {},
        time: Date.now(),
        hidden: false,
        status: 'visible',
        authorRole: state.isAdmin ? 'admin' : 'anonymous'
      });

      setCooldown(POST_COOLDOWN_KEY);
      await save();
      closeOverlay();
      render();
    }

    function showCreateNest() {
      if (!state.isAdmin) return;

      const emojis = ['📣','🏆','📚','🎉','🎨','🎵','💡','🌱','⚽','🖥️','🎭','🌍','🌀','💬','🔥'];
      const emojiOptions = emojis.map(emoji => `<option value="${emoji}">${emoji}</option>`).join('');
      const colorOptions = NEST_COLORS.map((_, index) => `<option value="${index}">Color ${index + 1}</option>`).join('');

      showOverlay(`
        <h2>Create a Nest</h2>
        <label>Nest Name</label>
        <input id="nName" placeholder="e.g. Math Club">
        <label>Description</label>
        <input id="nDesc" placeholder="What's this nest about?">
        <label>Emoji</label>
        <select id="nEmoji">${emojiOptions}</select>
        <label>Color</label>
        <select id="nColor">${colorOptions}</select>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
          <button class="btn-submit" onclick="submitNest()">Create Nest</button>
        </div>
      `);
    }

    function showReorderNests() {
      if (!state.isAdmin) return;
      const rows = state.nests.map((n, i) => `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:30px;text-align:center;">${i+1}</div>
            <div style="min-width:140px;font-weight:600;">${escapeHtml(n.name)}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn-cancel" onclick="moveNestUp(${i})" ${i===0? 'disabled' : ''}>↑</button>
            <button class="btn-cancel" onclick="moveNestDown(${i})" ${i===state.nests.length-1? 'disabled' : ''}>↓</button>
          </div>
        </div>
      `).join('');

      showOverlay(`
        <h2>Reorder Nests</h2>
        <div style="max-height:360px;overflow:auto;padding-top:8px;">${rows}</div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
          <button class="btn-submit" onclick="saveReorderNests()">Save Order</button>
        </div>
      `);
    }

    function moveNestUp(index) {
      if (index <= 0) return;
      const tmp = state.nests[index-1];
      state.nests[index-1] = state.nests[index];
      state.nests[index] = tmp;
      showReorderNests();
    }

    function moveNestDown(index) {
      if (index >= state.nests.length - 1) return;
      const tmp = state.nests[index+1];
      state.nests[index+1] = state.nests[index];
      state.nests[index] = tmp;
      showReorderNests();
    }

    async function saveReorderNests() {
      // Persist locally; remote persistence would require adding an order column/server support.
      await save();
      closeOverlay();
      render();
    }

    async function submitNest() {
      const name = document.getElementById('nName').value.trim();
      const desc = document.getElementById('nDesc').value.trim();
      const emoji = document.getElementById('nEmoji').value;
      const color = Number(document.getElementById('nColor').value);

      if (!name) {
        alert('Please enter a name.');
        return;
      }

      const newNest = { id: `nest_${Date.now()}`, name, desc, emoji, color };
      if (useSupabase) {
        try {
          await createNestRemote(newNest);
          closeOverlay();
          render();
        } catch (err) {
          console.warn('Create nest failed', err);
          alert('Unable to create nest.');
        }
        return;
      }

      state.nests.push(newNest);
      await save();
      closeOverlay();
      render();
    }

    async function deletePost(id) {
      if (!state.isAdmin) return;
      if (useSupabase) {
        try {
          await supabaseClient.from('comments').delete().eq('post_id', id);
          await supabaseClient.from('reports').delete().eq('post_id', String(id));
          await deletePostRemote(id);
          state.selectedPost = sameId(state.selectedPost, id) ? null : state.selectedPost;
          render();
        } catch (err) {
          console.warn('Remote delete failed', err);
        }
        return;
      }

      state.posts = state.posts.filter(post => !sameId(post.id, id));
      state.comments = state.comments.filter(comment => !sameId(comment.postId, id));
      state.reports = state.reports.filter(report => !sameId(report.postId, id));
      await save();
      state.selectedPost = sameId(state.selectedPost, id) ? null : state.selectedPost;
      render();
    }

    load();
  </script>
</body>
</html>
